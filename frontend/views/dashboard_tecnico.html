<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | Helpdesk Técnico/Admin</title> <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/form.css"> 
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
</head>
<body>
    <div id="header-container"></div>

    <main class="container">
        <div class="dashboard-main-content">
            <h1 id="welcome-message" style="margin-bottom: 1.5rem;">Bienvenido, Técnico/Admin</h1>
            
            <div id="message-area-global-dashboard-tec" class="message-box" style="display: none;"></div>

            <section id="admin-specific-actions" class="dashboard-actions" style="display: none; margin-bottom: 2rem; justify-content: flex-start; flex-wrap: wrap;">
                </section>
            <section class="dashboard-filters card-like-section">
                <h2>Filtros de Tickets</h2>
                <div class="filters-grid">
                    <div class="filter-group form-group">
                        <label for="status-filter">Estado:</label>
                        <select id="status-filter" name="id_estado"> 
                            <option value="">Todos los Estados</option>
                            <option value="1">Abiertos</option>
                            <option value="2">En progreso</option>
                            <option value="3">Cerrados</option>
                            <option value="4">Pendientes</option>
                            <option value="5">Resueltos</option>
                        </select>
                    </div>
                    <div class="filter-group form-group">
                        <label for="priority-filter">Prioridad:</label>
                        <select id="priority-filter" name="id_prioridad"> 
                            <option value="">Todas las Prioridades</option>
                            <option value="1">Baja</option>
                            <option value="2">Media</option>
                            <option value="3">Alta</option>
                            <option value="4">Urgente</option>
                        </select>
                    </div>
                    <div class="filter-group form-group">
                        <label for="category-filter">Categoría:</label>
                        <select id="category-filter" name="id_categoria"> 
                            <option value="">Todas las Categorías</option>
                            </select>
                    </div>

                    <div id="technician-filter-group" class="filter-group form-group" style="display: none;">
                        <label for="technician-filter">Técnico Asignado:</label>
                        <select id="technician-filter" name="id_tecnico_asignado">
                            <option value="">Todos los Técnicos</option>
                            <option value="null">Sin Asignar</option>
                            </select>
                    </div>
                    <div class="filter-group form-group" style="display: flex; gap: 0.5rem; flex-wrap: nowrap; align-items: flex-end;">
                        <button id="apply-filters-button" class="btn btn-primary" style="flex-grow: 1;">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-funnel-fill" viewBox="0 0 16 16" style="margin-right: 6px;"><path d="M1.5 1.5A.5.5 0 0 1 2 1h12a.5.5 0 0 1 .5.5v2a.5.5 0 0 1-.128.334L10 8.692V13.5a.5.5 0 0 1-.342.474l-3 1A.5.5 0 0 1 6 14.5V8.692L1.628 3.834A.5.5 0 0 1 1.5 3.5z"/></svg>
                            Aplicar
                        </button>
                        <button id="refresh-tickets-button" class="btn btn-secondary" title="Limpiar filtros y recargar todos los tickets">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-arrow-clockwise" viewBox="0 0 16 16">
                                <path fill-rule="evenodd" d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2z"/>
                                <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466"/>
                            </svg>
                        </button>
                    </div>
                </div>
            </section>

            <section class="tickets-section card-like-section" style="margin-top: 2rem;">
                <h2>Lista de Tickets</h2> 
                <div id="loading-message" class="message-box info" style="display: none;">Cargando tickets...</div>
                <div id="error-tickets-message" class="message-box error" style="display: none;">
                    Error al cargar los tickets. Intenta de nuevo.
                </div>
                <div id="no-tickets-message" class="message-box info" style="display: none; text-align:center;">
                    No hay tickets que coincidan con los filtros o no hay tickets disponibles.
                </div>
                <div id="tickets-list" class="ticket-grid">
                    </div>
            </section>

            <div style="text-align: center; margin-top: 2rem; margin-bottom: 1rem;">
                <a href="#" id="logout-link" class="btn btn-danger" style="min-width: 180px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-right" viewBox="0 0 16 16" style="margin-right: 8px;">
                        <path fill-rule="evenodd" d="M10 12.5a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-9a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v2a.5.5 0 0 0 1 0v-2A1.5 1.5 0 0 0 9.5 2h-8A1.5 1.5 0 0 0 0 3.5v9A1.5 1.5 0 0 0 1.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-2a.5.5 0 0 0-1 0z"/>
                        <path fill-rule="evenodd" d="M15.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 0 0-.708.708L14.293 7.5H5.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/>
                    </svg>
                    Cerrar sesión
                </a>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="../js/utils.js"></script>
    <script src="../js/dashboard_tecnico.js"></script>
    <script>
        if (typeof window.loadComponent === 'function') {
            window.loadComponent('header', '../components/header.html');
            window.loadComponent('footer', '../components/footer.html');
        } else {
            console.error("Error: La función loadComponent de utils.js no está definida.");
        }
    </script>
</body>
</html>
