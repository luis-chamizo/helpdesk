<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>HelpDesk - Inicio</title>
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="icon" href="../favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="../favicon.ico" type="image/x-icon">
</head>
<body>
    <div id="header-container"></div>

    <main class="centered-page-container"> <div class="welcome-menu"> <div class="icon">🛠️</div>
            <h2>Bienvenido al Sistema HelpDesk</h2>
            <p>Gestión eficiente de soporte. Accede y soluciona problemas rápidamente.</p>
            <div class="form-actions" style="flex-direction: row; justify-content: center; gap: 1rem;">
                <button class="btn btn-primary" onclick="window.location.href='login.html'" style="min-width: 160px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-box-arrow-in-right" viewBox="0 0 16 16"><path fill-rule="evenodd" d="M6 3.5a.5.5 0 0 1 .5-.5h8a.5.5 0 0 1 .5.5v9a.5.5 0 0 1-.5.5h-8a.5.5 0 0 1-.5-.5v-2a.5.5 0 0 0-1 0v2A1.5 1.5 0 0 0 6.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-9A1.5 1.5 0 0 0 14.5 2h-8A1.5 1.5 0 0 0 5 3.5v2a.5.5 0 0 0 1 0z"/><path fill-rule="evenodd" d="M11.854 8.354a.5.5 0 0 0 0-.708l-3-3a.5.5 0 1 0-.708.708L10.293 7.5H1.5a.5.5 0 0 0 0 1h8.793l-2.147 2.146a.5.5 0 0 0 .708.708z"/></svg>
                    Iniciar Sesión
                </button>
                <button class="btn btn-secondary" onclick="window.location.href='register.html'" style="min-width: 160px;">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-person-plus-fill" viewBox="0 0 16 16"><path d="M1 14s-1 0-1-1 1-4 6-4 6 3 6 4-1 1-1 1zm5-6a3 3 0 1 0 0-6 3 3 0 0 0 0 6"/><path fill-rule="evenodd" d="M13.5 5a.5.5 0 0 1 .5.5V7h1.5a.5.5 0 0 1 0 1H14v1.5a.5.5 0 0 1-1 0V8h-1.5a.5.5 0 0 1 0-1H13V5.5a.5.5 0 0 1 .5-.5"/></svg>
                    Registrarse
                </button>
            </div>
        </div>
    </main>

    <div id="footer-container"></div>

    <script src="../js/utils.js"></script>
    <script>
        // Cargar header y footer dinámicamente
        if (typeof window.loadComponent === 'function') {
            window.loadComponent('header', '../components/header.html');
            window.loadComponent('footer', '../components/footer.html');
        } else {
            console.error("Error: La función loadComponent de utils.js no está definida o utils.js no se cargó correctamente.");
        }
    </script>
</body>
</html>
