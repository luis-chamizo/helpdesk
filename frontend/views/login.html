<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión | HelpDesk</title>
  <link rel="stylesheet" href="../css/style.css" /> <link rel="stylesheet" href="../css/form.css" />  <link rel="icon" href="../favicon.ico" type="image/x-icon">
</head>
<body>
  <div id="header-container"></div>

  <main class="centered-page-container"> <div class="form-page-card"> <div class="form-icon" style="font-size: 2.5rem;">🔑</div> 
      <h2>Iniciar Sesión</h2>
      <form id="loginForm">
        <div class="form-group">
          <label for="usuario_login">Usuario o Correo</label>
          <input type="text" id="usuario_login" name="usuario_login" placeholder="Ingresa tu usuario o correo" required />
        </div>
        <div class="form-group">
          <label for="contrasena">Contraseña</label>
          <input type="password" id="contrasena" name="contrasena" placeholder="Ingresa tu contraseña" required />
        </div>
        <div class="form-actions"> 
            <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </div>
        <div id="message" class="message-box" style="display: none; margin-top: 1rem;"></div>
      </form>
      <div class="form-link-section">
        <p>¿No tienes cuenta? <a href="register.html">Regístrate aquí</a></p>
        <p><a href="index.html" class="btn-link">← Volver al inicio</a></p>
      </div>
    </div>
  </main>

  <div id="footer-container"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/auth/login.js"></script>
  <script>
    if (typeof window.loadComponent === 'function') {
        window.loadComponent('header', '../components/header.html');
        window.loadComponent('footer', '../components/footer.html');
    } else {
        console.error("Error: loadComponent no está definido. Asegúrate que utils.js se carga correctamente y antes que este script.");
    }
  </script>
</body>
</html>
